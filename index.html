<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Open in Outlook</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#132E52; font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#132E52; }
  .card { background:#fff; margin:16px; padding:24px 22px; max-width:380px; width:100%; border-top:3px solid #FFC101; box-shadow:0 12px 40px rgba(0,0,0,.3); text-align:center; }
  h1 { font-size:20px; margin:0 0 6px; }
  p { margin:0 0 18px; color:#5B6472; font-size:14px; }
  a.btn { display:block; padding:14px; margin-top:10px; text-decoration:none; font-weight:700; }
  .app { background:#1A3E6E; color:#fff; }
  .web { border:1px solid #B6BFCE; color:#132E52; }
</style>
</head>
<body>
<div class="card">
  <h1>Opening the email in Outlook</h1>
  <p id="msg">If Outlook doesn't open by itself, tap the button.</p>
  <a class="btn app" id="app" href="#">Open in Outlook app</a>
  <a class="btn web" id="web" href="#">Open in Outlook on the web</a>
</div>
<script>
// The email's Outlook item id comes after the # so it is never sent to this
// site's server: index.html#id=<Graph item id>
(function () {
  var h = new URLSearchParams(location.hash.slice(1));
  var id = h.get('id') || '';
  if (!/^[A-Za-z0-9_=+\/-]{20,400}$/.test(id)) {
    document.getElementById('msg').textContent = 'This link has no email id.';
    document.getElementById('app').style.display = 'none';
    document.getElementById('web').style.display = 'none';
    return;
  }
  var urlSafe = id.replace(/\+/g, '_').replace(/\//g, '-');
  var std = id.replace(/_/g, '+').replace(/-/g, '/');
  var app = 'ms-outlook://emails/message/open?restID=' + encodeURIComponent(urlSafe);
  var web = 'https://outlook.office365.com/owa/?ItemID=' + encodeURIComponent(std) + '&exvsurl=1&viewmodel=ReadMessageItem';
  document.getElementById('app').href = app;
  document.getElementById('web').href = web;
  var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  if (mobile) location.href = app; else location.replace(web);
})();
</script>
</body>
</html>
